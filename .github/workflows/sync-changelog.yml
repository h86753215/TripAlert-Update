name: Sync Website Changelog

on:
  push:
    paths:
      - "update.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current version into changelog
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          update = json.loads(Path("update.json").read_text(encoding="utf-8"))
          path = Path("changelog.json")
          if path.exists():
              history = json.loads(path.read_text(encoding="utf-8"))
          else:
              history = []

          version = str(update.get("versionName", "")).lstrip("v")
          notes = str(update.get("notes", "")).strip()

          # Public update notes should be short and easy to understand.
          # Remove version prefixes and keep only the first one or two useful sentences.
          import re
          notes = re.sub(r"^v?\\d+(?:\\.\\d+)+[：:]\\s*", "", notes, flags=re.I)
          replacements = {
              "geocoder": "地址定位",
              "parser": "車單辨識",
              "sentConfirmed": "已送出",
              "sourceKey": "來源記錄",
              "repost": "重複轉貼",
              "PendingIntent": "系統限制",
              "SystemUI": "通知列",
              "回歸測試": "測試",
          }
          for old, new in replacements.items():
              notes = notes.replace(old, new)
          parts = [p.strip() for p in re.split(r"(?<=[。！？!?])", notes) if p.strip()]
          if parts:
              short = parts[0]
              if len(short) < 55 and len(parts) > 1 and len(short + parts[1]) <= 100:
                  short += parts[1]
              notes = short
          if len(notes) > 110:
              notes = notes[:110].rstrip("，、；;：: ") + "…"

          today = datetime.now(ZoneInfo("Asia/Taipei")).strftime("%Y-%m-%d")

          found = False
          generic_note = ("已發布" in notes and "覆蓋更新" in notes and "：" not in notes and ":" not in notes)
          for item in history:
              if str(item.get("version","")).lstrip("v") == version:
                  # Keep richer hand-authored notes when update.json only contains
                  # the generic release sentence.
                  if notes and (not generic_note or not item.get("notes")):
                      item["notes"] = notes
                  item["date"] = item.get("date") or today
                  found = True
                  break

          if version and not found:
              history.insert(0, {"version": version, "date": today, "notes": notes})

          def key(item):
              try:
                  return tuple(int(x) for x in str(item.get("version","0")).split("."))
              except Exception:
                  return (0,)
          history.sort(key=key, reverse=True)
          path.write_text(json.dumps(history, ensure_ascii=False, indent=2)+"\n", encoding="utf-8")
          PY

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add changelog.json
          git diff --cached --quiet && exit 0
          git commit -m "Sync website version history"
          git pull --rebase origin main
          git push origin main

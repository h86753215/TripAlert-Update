name: Generate HTA Promo Video

on:
  push:
    paths:
      - "promo-video-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-cjk
          python -m pip install --upgrade pip
          pip install pillow

      - name: Generate HTA promo video
        run: python scripts/generate_promo_video.py

      - name: Commit generated video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hta-main-demo.mp4 hta-main-demo-poster.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Refresh HTA promo video"
          git push

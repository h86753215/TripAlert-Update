name: Publish Real App Demo Video

on:
  push:
    paths:
      - "promo-real-trigger.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild MP4 from chunks
        run: |
          cat .video-chunks/v00 .video-chunks/v01 .video-chunks/v02 .video-chunks/v03 .video-chunks/v04 > /tmp/video.b64
          base64 -d /tmp/video.b64 > hta-main-demo.mp4
          file hta-main-demo.mp4
          test -s hta-main-demo.mp4
      - name: Commit video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hta-main-demo.mp4
          git diff --cached --quiet && exit 0
          git commit -m "Publish APP real-screen demo video"
          git pull --rebase origin main
          git push origin main

<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#090a0e">
  <meta name="description" content="HTA 趟訊版本更新紀錄。版本號與更新內容會跟著正式發佈資訊同步。">
  <link rel="canonical" href="https://htaxun.com/updates.html">
  <link rel="icon" type="image/webp" href="hta-tangxun-icon.webp">
  <link rel="manifest" href="manifest.webmanifest">
  <title>版本更新｜HTA 趟訊</title>
  <style>
    :root{--bg:#090a0e;--panel:#11151c;--text:#f7f8fb;--muted:#9ca4b1;--line:rgba(255,255,255,.09);--gold:#d8ab5d;--gold2:#f1d698;--red:#ef3656;--green:#61e4a2;--max:860px}
    *{box-sizing:border-box}html{scroll-behavior:smooth}
    body{margin:0;background:radial-gradient(760px 420px at 50% -120px,rgba(216,171,93,.12),transparent 68%),linear-gradient(180deg,#090a0e,#0a0c11 60%,#08090c);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7}
    a{color:inherit;text-decoration:none}.wrap{width:min(var(--max),calc(100% - 34px));margin:auto}
    nav{position:sticky;top:0;z-index:40;background:rgba(9,10,14,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(216,171,93,.16)}
    .navin{height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:10px;font-weight:850}.brand img{width:34px;height:34px;border-radius:10px}.back{font-size:14px;color:#abb2bd;font-weight:750}
    header{padding:58px 0 34px}.eyebrow{color:var(--gold2);font-size:12px;font-weight:900;letter-spacing:.13em}.title{font-size:clamp(38px,7vw,58px);line-height:1.08;letter-spacing:-.045em;margin:10px 0 12px}.sub{color:var(--muted);margin:0;max-width:700px}
    .latest{margin-top:30px;border:1px solid rgba(216,171,93,.34);border-radius:24px;padding:26px;background:linear-gradient(145deg,rgba(216,171,93,.10),rgba(239,54,86,.05)),#11151c}
    .latestTop{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.version{font-size:42px;font-weight:930;letter-spacing:-.04em}.date{font-size:12px;color:#7e8795;margin-top:2px}.badge{display:inline-flex;padding:6px 10px;border:1px solid rgba(97,228,162,.28);background:rgba(97,228,162,.07);border-radius:999px;color:#8af0ba;font-size:11px;font-weight:850}
    .latestNotes{margin:20px 0 0;padding-left:21px;color:#c5cbd5}.latestNotes li{margin:8px 0}
    .history{padding:8px 0 70px}.release{border-left:2px solid rgba(216,171,93,.24);padding:0 0 30px 24px;position:relative}.release::before{content:"";position:absolute;left:-7px;top:8px;width:12px;height:12px;border-radius:50%;background:#d8ab5d;box-shadow:0 0 0 5px #090a0e}.release h2{font-size:24px;margin:0 0 2px}.release .meta{color:#7f8794;font-size:12px;margin-bottom:9px}.release ul{margin:0;padding-left:20px;color:#aeb5c1}.release li{margin:6px 0}
    .btn{display:inline-flex;align-items:center;justify-content:center;border-radius:13px;padding:12px 17px;font-weight:850;border:1px solid var(--line)}.primary{background:linear-gradient(135deg,#ef3656,#bd1535);border-color:transparent}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}
    footer{border-top:1px solid var(--line);padding:30px 0 54px;text-align:center;color:#747d8a;font-size:12px}
    @media(max-width:600px){.latestTop{flex-direction:column}.version{font-size:36px}}
  </style>
</head>
<body>
<nav><div class="wrap navin"><a class="brand" href="./"><img src="hta-tangxun-icon.webp" alt="">HTA 趟訊</a><a class="back" href="./">← 回首頁</a></div></nav>

<header><div class="wrap">
  <div class="eyebrow">VERSION HISTORY</div>
  <h1 class="title">版本更新</h1>
  <p class="sub">從現在起，正式發佈的版本號與更新說明會自動同步到這一頁，並保留舊版本紀錄。</p>

  <div class="latest">
    <div class="latestTop">
      <div><div class="badge">目前最新版</div><div class="version" id="latestVersion">載入中</div><div class="date" id="latestDate"></div></div>
      <a class="btn primary" href="download.html">下載最新版</a>
    </div>
    <ul class="latestNotes" id="latestNotes"><li>正在讀取更新內容…</li></ul>
    <div class="actions"><a class="btn" href="https://lin.ee/y9RBpXc" target="_blank" rel="noopener">官方 LINE 詢問</a><a class="btn" href="download.html">安裝／更新教學</a></div>
  </div>
</div></header>

<main class="history"><div class="wrap" id="history"></div></main>
<footer><div class="wrap">© 2026 HTA 趟訊 · <a href="./">官網首頁</a> · <a href="download.html#apk-download">下載 Android APK</a></div></footer>

<script>
const splitNotes = text => String(text||"")
  .split(/[；;\n]+/)
  .map(s=>s.trim())
  .filter(Boolean);

Promise.all([
  fetch("update.json",{cache:"no-store"}).then(r=>r.ok?r.json():null),
  fetch("changelog.json",{cache:"no-store"}).then(r=>r.ok?r.json():[])
]).then(([update,history])=>{
  history=Array.isArray(history)?history:[];
  if(update&&update.versionName){
    const v=String(update.versionName).replace(/^v/i,"");
    const found=history.find(x=>String(x.version).replace(/^v/i,"")===v);
    if(!found) history.unshift({version:v,date:"",notes:update.notes||""});
    else if(update.notes) found.notes=update.notes;
  }
  history.sort((a,b)=>{
    const pa=String(a.version||"0").split(".").map(Number), pb=String(b.version||"0").split(".").map(Number);
    for(let i=0;i<Math.max(pa.length,pb.length);i++){const d=(pb[i]||0)-(pa[i]||0);if(d)return d}
    return 0;
  });

  const latest=history[0]||{};
  document.getElementById("latestVersion").textContent=latest.version?"v"+latest.version:"暫無版本";
  document.getElementById("latestDate").textContent=latest.date||"";
  const notes=splitNotes(latest.notes);
  document.getElementById("latestNotes").innerHTML=(notes.length?notes:["目前沒有更新說明"]).map(n=>"<li>"+n+"</li>").join("");

  document.getElementById("history").innerHTML=history.slice(1).map(item=>{
    const ns=splitNotes(item.notes);
    return '<article class="release"><h2>v'+item.version+'</h2><div class="meta">'+(item.date||"")+'</div><ul>'+
      (ns.length?ns:["未提供更新說明"]).map(n=>"<li>"+n+"</li>").join("")+
      '</ul></article>';
  }).join("");
}).catch(()=>{
  document.getElementById("latestVersion").textContent="讀取失敗";
  document.getElementById("latestNotes").innerHTML="<li>請稍後重新整理。</li>";
});

if ("serviceWorker" in navigator) {
  window.addEventListener("load",()=>navigator.serviceWorker.register("/service-worker.js").catch(()=>{}));
}
</script>
</body>
</html>
